name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    needs: notes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run selftest
        run: bun run selftest

      - name: Package artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: ./scripts/package-release.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sessionbus-${{ github.ref_name }}-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" dist/*.tar.gz dist/*.sha256 --clobber

  notes:
    name: Ensure draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create draft release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release already exists"
          else
            bun run release:notes "${{ github.ref_name }}" > release-notes.md
            gh release create "${{ github.ref_name }}" --draft --title "Sessionbus ${{ github.ref_name }}" --notes-file release-notes.md
          fi
